name: Construir Calculadora desde ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar ZIP
        uses: actions/checkout@v5

      - name: Descomprimir proyecto
        run: |
          unzip -q Calculadora-Yefferson-Proyecto.zip
          cd Calculadora-Yefferson
          ls -la

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar SDK Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          cd Calculadora-Yefferson
          gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculadora-Yefferson-APK
          path: Calculadora-Yefferson/app/build/outputs/apk/debug/app-debug.apk
