name: Construir Calculadora desde ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar ZIP
        uses: actions/checkout@v5

      - name: Descomprimir proyecto
        run: |
         unzip -q Calculadora-Yefferson-Proyecto.zip
         PROJECT_DIR=$(dirname "$(find . -name settings.gradle -print -quit)")
         echo "Proyecto encontrado en: $PROJECT_DIR"
         echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar SDK Android
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
         cd "$PROJECT_DIR"
         gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculadora-Yefferson-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
