name: Construir Calculadora desde ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          test -f Calculadora-Yefferson-Proyecto.zip || {
            echo "No se encontró Calculadora-Yefferson-Proyecto.zip en la raíz del repositorio."
            exit 1
          }

          unzip -q -o Calculadora-Yefferson-Proyecto.zip

          PROJECT_DIR=$(dirname "$(find . -name settings.gradle -print -quit)")

          test -n "$PROJECT_DIR" || {
            echo "No se encontró settings.gradle"
            exit 1
          }

          echo "Proyecto encontrado en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar SDK Android, NDK y CMake
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar firma permanente
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Falta KEYSTORE_BASE64."
            exit 1
          fi

          mkdir -p "$PROJECT_DIR/app"

          echo "$KEYSTORE_BASE64" | base64 --decode > "$PROJECT_DIR/app/yefferson-release-key.jks"

          test -s "$PROJECT_DIR/app/yefferson-release-key.jks"

      - name: Compilar APK Release firmado
        env:
          KEYSTORE_FILE: yefferson-release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd "$PROJECT_DIR"
          gradle assembleRelease --no-daemon --stacktrace

      - name: Borrar keystore del runner
        if: always()
        run: |
          rm -f "$PROJECT_DIR/app/yefferson-release-key.jks"

      - name: Buscar APK generado
        run: |
            echo "=== APK GENERADOS ==="
            find "$PROJECT_DIR/app/build/outputs" -type f -name "*.apk" -print

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
            name: Calculadora-Yefferson-V6-RELEASE-FIRMADA
            path: |
              **/app/build/outputs/**/*.apk
            if-no-files-found: error
